name: Backend integration QA
on:
  pull_request:
    paths: ['server/**', '.github/workflows/backend-qa.yml']
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/backend-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: investking_test
          POSTGRES_PASSWORD: qa-only
          POSTGRES_DB: investking_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://investking_test:qa-only@127.0.0.1:5432/investking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run test:integration
        working-directory: server
